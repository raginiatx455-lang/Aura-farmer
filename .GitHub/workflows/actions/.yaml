name: 150 Wallets AI Airdrop Farmer & Sweeper

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  airdrop_farm:
    runs-on: ubuntu-latest
    steps:
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Web3 & AI Modules
      run: pip install web3 eth-account google-generativeai

    - name: Execute 150-Wallet Master Engine
      env:
        MY_MAIN_ETH_ADDRESS: ${{ secrets.MY_MAIN_ETH_ADDRESS }}
        MASTER_SEED_PHRASE: ${{ secrets.MASTER_SEED_PHRASE }}
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        RPC_URL: ${{ secrets.RPC_URL }}
      run: |
        cat << 'EOF' > master_farmer.py
        import os
        import sys
        import time
        import random
        from web3 import Web3
        from eth_account import Account
        import google.generativeai as genai

        Account.enable_unaudited_hdwallet_features()

        main_address = os.getenv('MY_MAIN_ETH_ADDRESS')
        seed_phrase = os.getenv('MASTER_SEED_PHRASE')
        gemini_key = os.getenv('GEMINI_API_KEY')
        rpc_url = os.getenv('RPC_URL', 'https://arb1.arbitrum.io/rpc')

        if not main_address or not seed_phrase:
            print("❌ Secrets missing! Configure MY_MAIN_ETH_ADDRESS and MASTER_SEED_PHRASE.")
            sys.exit(1)

        w3 = Web3(Web3.HTTPProvider(rpc_url.strip()))
        if not w3.is_connected():
            print("❌ RPC connection failed.")
            sys.exit(1)

        main_checksum = w3.to_checksum_address(main_address.strip())
        chain_id = w3.eth.chain_id
        print(f"📡 Connected to Chain ID: {chain_id}")
        print(f"🎯 Target Destination Wallet: {main_checksum}\n")

        # 1. Deterministic derivation of 150 Persistent Wallets
        TOTAL_WALLETS = 150
        clean_seed = " ".join(seed_phrase.strip().split())
        wallets = []
        try:
            print(f"🔐 Deriving and saving {TOTAL_WALLETS} persistent wallets from master seed...")
            for i in range(TOTAL_WALLETS):
                path = f"m/44'/60'/0'/0/{i}"
                acct = Account.from_mnemonic(clean_seed, account_path=path)
                wallets.append(acct)
            print(f"✅ {len(wallets)} Wallets loaded in secure memory.\n")
        except Exception as e:
            print(f"❌ Wallet derivation failed: {e}")
            sys.exit(1)

        # 2. AI Market Intelligence Layer
        ai_trigger = "YES"
        if gemini_key:
            try:
                genai.configure(api_key=gemini_key.strip())
                model = genai.GenerativeModel('gemini-1.5-flash')
                print("🧠 Asking Gemini AI to verify active distribution pipelines...")
                prompt = "Respond with strictly YES if decentralized airdrop scanning should proceed."
                response = model.generate_content(prompt)
                ai_trigger = response.text.strip().upper()
                print(f"🤖 Gemini Status: {ai_trigger}\n")
            except Exception as e:
                print(f"⚠️ AI Module Warning: {e}. Defaulting to YES.")

        # 3. Surveillance and Auto-Sweep Routine
        gas_limit = 21000
        swept_count = 0

        for idx, acct in enumerate(wallets):
            addr = acct.address
            try:
                balance_wei = w3.eth.get_balance(addr)
                balance_eth = w3.from_wei(balance_wei, 'ether')
                print(f"[{idx+1}/{TOTAL_WALLETS}] Wallet {addr[:10]}... | Balance: {balance_eth:.6f}")

                # Gas Calculation
                try:
                    fee_history = w3.eth.fee_history(1, 'latest', [25])
                    base_fee = fee_history['baseFeePerGas'][-1]
                    priority_fee = w3.eth.max_priority_fee
                    max_fee = int(base_fee * 1.5) + priority_fee
                    use_eip1559 = True
                except Exception:
                    max_fee = w3.eth.gas_price
                    use_eip1559 = False

                required_gas = gas_limit * max_fee

                # Auto-Sweep on Balance Detection
                if balance_wei > required_gas:
                    transferable_amount = balance_wei - required_gas
                    print(f"💰 Airdrop/Balance Detected! Sweeping {w3.from_wei(transferable_amount, 'ether')} ETH to {main_checksum[:10]}...")
                    nonce = w3.eth.get_transaction_count(addr, 'pending')
                    
                    if use_eip1559:
                        tx = {
                            'nonce': nonce,
                            'to': main_checksum,
                            'value': transferable_amount,
                            'gas': gas_limit,
                            'maxFeePerGas': max_fee,
                            'maxPriorityFeePerGas': priority_fee,
                            'chainId': chain_id,
                            'type': 2
                        }
                    else:
                        tx = {
                            'nonce': nonce,
                            'to': main_checksum,
                            'value': transferable_amount,
                            'gas': gas_limit,
                            'gasPrice': max_fee,
                            'chainId': chain_id
                        }

                    signed_tx = w3.eth.account.sign_transaction(tx, acct.key)
                    tx_hash = w3.eth.send_raw_transaction(signed_tx.rawTransaction)
                    print(f"🚀 Swept Successfully! TX Hash: {w3.to_hex(tx_hash)}")
                    swept_count += 1
                    time.sleep(2)
            except Exception as err:
                print(f"⚠️ Scan error on wallet {addr[:10]}: {err}")

            # Safe interval to avoid RPC rate limiting
            time.sleep(0.2)

        print(f"\n✅ Surveillance complete. Total active sweeps executed: {swept_count}")
        EOF

        python master_farmer.py
