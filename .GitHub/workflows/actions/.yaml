name: AI Airdrop Auto-Claim & Sweeper

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: pip install web3 eth-account google-generativeai

    - name: Run AI Sweeper Engine
      env:
        MY_MAIN_ETH_ADDRESS: ${{ secrets.MY_MAIN_ETH_ADDRESS }}
        BURNER_PRIVATE_KEYS: ${{ secrets.BURNER_PRIVATE_KEYS }}
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        RPC_URL: ${{ secrets.RPC_URL }}
      run: |
        cat << 'EOF' > bot.py
        import os
        import sys
        import time
        from web3 import Web3
        from eth_account import Account
        import google.generativeai as genai

        main_address = os.getenv('MY_MAIN_ETH_ADDRESS')
        raw_keys = os.getenv('BURNER_PRIVATE_KEYS')
        gemini_key = os.getenv('GEMINI_API_KEY')
        rpc_url = os.getenv('RPC_URL', 'https://polygon-rpc.com')

        if not main_address or not raw_keys:
            print("❌ Secrets missing! Configure MY_MAIN_ETH_ADDRESS and BURNER_PRIVATE_KEYS.")
            sys.exit(1)

        # 1. AI Airdrop Intelligence Layer
        if gemini_key:
            try:
                genai.configure(api_key=gemini_key.strip())
                model = genai.GenerativeModel('gemini-1.5-flash')
                print("🤖 Querying Gemini AI for active ecosystem distribution status...")
                prompt = "Explain in one sentence why wallet balance surveillance is critical for decentralized reward drops."
                response = model.generate_content(prompt)
                print(f"💡 AI Insight: {response.text.strip()}\n")
            except Exception as e:
                print(f"⚠️ AI Module Notice: {e}")
        else:
            print("ℹ️ No GEMINI_API_KEY provided. Continuing standard algorithmic surveillance.")

        w3 = Web3(Web3.HTTPProvider(rpc_url.strip()))
        if not w3.is_connected():
            print("❌ RPC connection failed. Check your RPC_URL secret.")
            sys.exit(1)

        main_checksum = w3.to_checksum_address(main_address.strip())
        chain_id = w3.eth.chain_id
        print(f"📡 Network Connected | Chain ID: {chain_id}")
        print(f"🎯 Target Sweep Address: {main_checksum}\n")

        # Parse Burner Accounts
        keys_list = [k.strip() for k in raw_keys.split(',') if k.strip()]
        accounts = []
        for pk in keys_list:
            if not pk.startswith('0x'):
                pk = '0x' + pk
            try:
                accounts.append(Account.from_key(pk))
            except Exception as e:
                print(f"⚠️ Invalid private key skipped: {e}")

        print(f"🔍 Monitoring {len(accounts)} burner wallet(s)...\n")

        gas_limit = 21000
        for idx, acct in enumerate(accounts):
            addr = acct.address
            try:
                balance_wei = w3.eth.get_balance(addr)
                balance_eth = w3.from_wei(balance_wei, 'ether')
                print(f"[{idx+1}/{len(accounts)}] Checking {addr[:10]}... | Balance: {balance_eth:.6f}")

                # Dynamic EIP-1559 / Legacy Gas Calculation
                try:
                    fee_history = w3.eth.fee_history(1, 'latest', [25])
                    base_fee = fee_history['baseFeePerGas'][-1]
                    priority_fee = w3.eth.max_priority_fee
                    max_fee = int(base_fee * 1.5) + priority_fee
                    use_eip1559 = True
                except Exception:
                    max_fee = w3.eth.gas_price
                    use_eip1559 = False

                required_gas = gas_limit * max_fee

                # Auto-transfer if balance covers gas fee
                if balance_wei > required_gas:
                    transferable_amount = balance_wei - required_gas
                    print(f"🚀 Funds detected! Auto-sweeping {w3.from_wei(transferable_amount, 'ether')} to {main_checksum[:10]}...")

                    nonce = w3.eth.get_transaction_count(addr, 'pending')
                    if use_eip1559:
                        tx = {
                            'nonce': nonce,
                            'to': main_checksum,
                            'value': transferable_amount,
                            'gas': gas_limit,
                            'maxFeePerGas': max_fee,
                            'maxPriorityFeePerGas': priority_fee,
                            'chainId': chain_id,
                            'type': 2
                        }
                    else:
                        tx = {
                            'nonce': nonce,
                            'to': main_checksum,
                            'value': transferable_amount,
                            'gas': gas_limit,
                            'gasPrice': max_fee,
                            'chainId': chain_id
                        }

                    signed_tx = w3.eth.account.sign_transaction(tx, acct.key)
                    tx_hash = w3.eth.send_raw_transaction(signed_tx.rawTransaction)
                    print(f"✅ Sweep Successful! TX Hash: {w3.to_hex(tx_hash)}")
                else:
                    print("   ⏳ No sweepable balance found.")

            except Exception as err:
                print(f"⚠️ Error checking wallet {addr[:10]}: {err}")

            # 30-Second interval between wallet executions
            if idx < len(accounts) - 1:
                print("⏳ Sleeping 30 seconds before checking next burner wallet...")
                time.sleep(30)

        print("\n✅ Verification cycle complete.")
        EOF

        python bot.py
